name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@khaime-team'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The data file is checked in; this fails the build if it drifts from
      # what the current libphonenumber-js and i18n-iso-countries produce.
      - run: npm run generate && git diff --exit-code src/data/countries.generated.ts
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write, so the release step below can create the GitHub Release.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@khaime-team'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # The data file is checked in; this fails the build if it drifts from
      # what the current libphonenumber-js and i18n-iso-countries produce.
      - run: npm run generate && git diff --exit-code src/data/countries.generated.ts

      # Treats "this version is already in the registry" as success. Moving a
      # tag re-runs this job against a version that published on the previous
      # run, and a hard failure there would both cry wolf and skip the release
      # step below. Every other publish error still fails the job.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          output=$(npm publish 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ] && ! echo "$output" | grep -q 'E409'; then
            exit $status
          fi
          if [ $status -ne 0 ]; then
            echo "Version already published; leaving the existing one in place."
          fi

      # Only tag pushes name a release; workflow_dispatch runs off a branch.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
